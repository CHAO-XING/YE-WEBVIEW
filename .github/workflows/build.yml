name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: YE-WEBVIEW-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Update latest-debug tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git tag -f latest-debug
          git push -f origin latest-debug
      - name: Release latest-debug
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: latest-debug
          prerelease: true
          body: "main 分支最新调试版 APK（commit ${{ github.sha }}）"
          files: app/build/outputs/apk/debug/app-debug.apk

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: YE-WEBVIEW-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/shots.sh apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YE-WEBVIEW-screenshots
          path: shots/*.png
